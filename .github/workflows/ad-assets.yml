name: Make ad assets

# Run by hand. Makes AI pictures and voices for the "two students" ad with Google AI,
# using the GOOGLE_TTS_API_KEY and VERTEX_API_KEY secrets, and saves them to the
# ad-assets branch. Nothing here changes the website.
on:
  workflow_dispatch:
    inputs:
      set:
        description: 'What to make: photo (pictures + voices) or 3d (3D cartoon pictures)'
        default: 'photo'

permissions:
  contents: write

concurrency:
  group: ad-assets
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          if [ "${{ github.event.inputs.set }}" = "3d" ]; then node scripts/ad/generate-3d.mjs; else node scripts/ad/generate.mjs; fi
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      - name: Save to the ad-assets branch
        run: |
          git fetch -q origin ad-assets && git worktree add -q branch origin/ad-assets
          cp -r ad-out/. branch/
          cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Ad assets from run ${{ github.run_id }}" || exit 0
          git push -q origin HEAD:ad-assets

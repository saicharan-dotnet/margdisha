name: Deploy Supabase function

# Deploys the "collect-notices" Edge Function, which reads the government websites that
# refuse servers outside India. Needs the repository secret SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access Tokens).
on:
  push:
    branches: [main]
    paths: ['src/notices/**', 'supabase/functions/**', '.github/workflows/deploy-function.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fn:build
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy collect-notices
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the function was not deployed. See docs/NOTICES.md."
            exit 0
          fi
          supabase functions deploy collect-notices --project-ref rimsuaeqnxntgfmbicyb --use-api --no-verify-jwt

name: Collect official notices

# Every 30 minutes, read official websites (SSC, UPSC, RRB, IBPS, Navodaya, Sainik, KVS ...)
# and save the title and link of any new notice. Admins review them before they become listings.
on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes, on odd minutes (GitHub often skips busy on-the-hour slots)
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated source ids to run (blank = all)'
        required: false
      debug:
        description: 'Print every link found, save nothing'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # to start the Shorts job when a big exam body posts something new

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run notices
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ONLY: ${{ github.event.inputs.only }}
          DEBUG: ${{ github.event.inputs.debug }}
      # A new notice from a big exam body (SSC, UPSC, RRB, IBPS, NTA ...): make its Short and thumbnail now
      # instead of waiting for the morning run. The Short is published as a release; nothing goes to YouTube.
      - name: Start a Short for new main exam notices
        if: always() && github.event.inputs.debug != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          if git fetch -q origin shorts-state 2>/dev/null; then git show FETCH_HEAD:processed.json > state/processed.json || true; fi
          MAIN=1 CHECK=/tmp/n node scripts/shorts/make.mjs
          if [ "$(cat /tmp/n)" -gt 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/shorts.yml/dispatches" -f ref=main -f "inputs[main]=true" -f "inputs[count]=3"
            echo "Started the Shorts job for $(cat /tmp/n) new main exam notice(s)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # A big exam body posted a new notification (not an admit card or result) for one of the main exams in
      # scripts/explainers/topics.json: also make a long explainer video about that exam, published as a release.
      - name: Start an explainer video for a new main exam notification
        if: always() && github.event.inputs.debug != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          if git fetch -q origin explainers-state 2>/dev/null; then git show FETCH_HEAD:explainers.json > state/explainers.json || true; fi
          MAIN=1 CHECK=/tmp/e node --experimental-strip-types --no-warnings scripts/explainers/make.mjs
          if [ "$(cat /tmp/e)" -gt 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/explainers.yml/dispatches" -f ref=main -f "inputs[main]=true" -f "inputs[count]=1"
            echo "Started the explainer video job for a new main exam notification." >> "$GITHUB_STEP_SUMMARY"
          fi

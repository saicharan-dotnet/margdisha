name: Collect official notices

# Every 6 hours, read official websites (SSC, UPSC, RRB, IBPS, Navodaya, Sainik, KVS ...)
# and save the title and link of any new notice. Admins review them before they become listings.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated source ids to run (blank = all)'
        required: false
      debug:
        description: 'Print every link found, save nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run notices
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ONLY: ${{ github.event.inputs.only }}
          DEBUG: ${{ github.event.inputs.debug }}

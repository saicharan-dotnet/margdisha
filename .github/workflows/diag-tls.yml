name: Diag TLS (temporary)
on:
  push:
    branches: [diag-notices-tls]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (compatible; MargDishaNoticeBot/1.0; +https://margdisha.com)'
          curl -sS -m 25 -A "$UA" https://ssc.gov.in/ -o ssc.html
          m=$(grep -oE 'main\.[a-f0-9]+\.js' ssc.html | head -1); curl -sS -m 25 -A "$UA" "https://ssc.gov.in/$m" -o m.js
          grep -oE '.{0,200}(getLastUpdates|apiPath\+|general-website/portal|noticeBoard|NoticeBoard|whatsNew|latestNews)[^;]{0,220}' m.js | head -40
          for p in "general-website/portal/records?page=1&limit=10&contentType=notice-boards&key=createdAt&order=DESC&isAttachment=true" "general-website/portal/last-updates" "general-website/portal/lastUpdates" "general-website/portal/notice-boards" ; do
            echo "--- $p"; curl -sS -m 25 -A "$UA" -H 'Accept: application/json' "https://ssc.gov.in/api/$p" | head -c 700; echo
          done
          exit 0

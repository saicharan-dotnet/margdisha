name: Diag TLS (temporary)
on:
  push:
    branches: [diag-notices-tls]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (compatible; MargDishaNoticeBot/1.0; +https://margdisha.com)'
          curl -sS -m 25 -A "$UA" https://ssc.gov.in/ -o ssc.html
          m=$(grep -oE 'main\.[a-f0-9]+\.js' ssc.html | head -1); curl -sS -m 25 -A "$UA" "https://ssc.gov.in/$m" -o m.js
          grep -oE 'getNoticeBoard\(K\)\{.{0,300}' m.js | head -3
          grep -oE '.{0,300}(getNoticeBoard|getDataByType)\(\{.{0,300}' m.js | head -8
          grep -oE '.{0,200}contentType.{0,200}' m.js | head -8
          exit 0

name: Diag TLS (temporary)
on:
  push:
    branches: [diag-notices-tls]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (compatible; MargDishaNoticeBot/1.0; +https://margdisha.com)'
          curl -sS -m 25 -A "$UA" https://ssc.gov.in/ -o ssc.html
          echo "--- notice-boards?page=1&limit=10&key=createdAt&order=DESC&isPaginationRequired=true&isAttachment=true&language=english"; curl -sS -m 25 -A "$UA" -H 'Accept: application/json' "https://ssc.gov.in/api/general-website/portal/notice-boards?page=1&limit=10&key=createdAt&order=DESC&isPaginationRequired=true&isAttachment=true&language=english" | head -c 1500; echo
          echo "--- notice-boards?page=1&limit=10&contentType=notice-boards&key=createdAt&order=DESC&isPaginationRequired=true&language=english"; curl -sS -m 25 -A "$UA" -H 'Accept: application/json' "https://ssc.gov.in/api/general-website/portal/notice-boards?page=1&limit=10&contentType=notice-boards&key=createdAt&order=DESC&isPaginationRequired=true&language=english" | head -c 1500; echo
          echo "--- records?page=1&limit=10&contentType=notice-boards&key=createdAt&order=DESC&isPaginationRequired=true&isAttachment=true&language=english&attributes=id,headline,contentType,language,createdAt"; curl -sS -m 25 -A "$UA" -H 'Accept: application/json' "https://ssc.gov.in/api/general-website/portal/records?page=1&limit=10&contentType=notice-boards&key=createdAt&order=DESC&isPaginationRequired=true&isAttachment=true&language=english&attributes=id,headline,contentType,language,createdAt" | head -c 1500; echo
          echo "--- records?page=1&limit=10&contentType=browse-exam&key=createdAt&order=DESC&isPaginationRequired=false&isAttachment=true&language=english&attributes=id,headline,examId,contentType,startDate,endDate,language,createdAt"; curl -sS -m 25 -A "$UA" -H 'Accept: application/json' "https://ssc.gov.in/api/general-website/portal/records?page=1&limit=10&contentType=browse-exam&key=createdAt&order=DESC&isPaginationRequired=false&isAttachment=true&language=english&attributes=id,headline,examId,contentType,startDate,endDate,language,createdAt" | head -c 1500; echo
          exit 0

<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1024, H = +P.get('h') || 1024, mode = P.get('mode') || 'logo';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf0a060, 60, 330);

// Sky gradient
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, fog: false, depthWrite: false,
  uniforms: { top: { value: new THREE.Color(0x1b4b78) }, mid: { value: new THREE.Color(0xd8683a) }, hor: { value: new THREE.Color(0xffc56e) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 hor; varying vec3 vP; void main(){ float h = vP.y; vec3 c = mix(hor, mid, smoothstep(0.0, 0.12, h)); c = mix(c, top, smoothstep(0.12, 0.55, h)); gl_FragColor = vec4(c,1.); }',
}));
scene.add(sky);

// Sun + glow
const SUN = new THREE.Vector3(14, 22, -300);
const sun = new THREE.Mesh(new THREE.SphereGeometry(20, 48, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.93, 0.7).multiplyScalar(1.6), fog: false, toneMapped: false }));
sun.position.copy(SUN); scene.add(sun);
const gc = document.createElement('canvas'); gc.width = gc.height = 256;
const g = gc.getContext('2d'); const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
rg.addColorStop(0, 'rgba(255,240,190,1)'); rg.addColorStop(.18, 'rgba(255,214,120,.85)'); rg.addColorStop(.45, 'rgba(255,160,70,.35)'); rg.addColorStop(1, 'rgba(255,120,40,0)');
g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gc), blending: THREE.AdditiveBlending, transparent: true, fog: false, depthWrite: false }));
glow.position.copy(SUN).add(new THREE.Vector3(0, 0, 10)); glow.scale.set(260, 260, 1); scene.add(glow);

// Lights
scene.add(new THREE.HemisphereLight(0xffc89a, 0x1f4d45, 1.1));
const key = new THREE.DirectionalLight(0xffd9a0, 3.2);
key.position.set(SUN.x * 0.06, 14, SUN.z * 0.06); key.target.position.set(0, 0, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 60 }); key.shadow.bias = -0.0005;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x9fd8ff, 0.6); rim.position.set(-6, 8, 10); scene.add(rim);

// Road path
const roadX = (z) => Math.sin(-z * 0.035) * 4 + Math.sin(-z * 0.011) * 6 - 0.0;
// Ground with low-poly hills away from the road
const ground = new THREE.PlaneGeometry(700, 700, 300, 300); ground.rotateX(-Math.PI / 2);
const pos = ground.attributes.position; const cols = [];
const cA = new THREE.Color(0x2f8a5c), cB = new THREE.Color(0x1d5f48), cC = new THREE.Color(0x6aa35a);
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const d = Math.abs(x - roadX(z));
  const n = Math.sin(x * 0.09) * Math.cos(z * 0.07) + Math.sin(x * 0.031 + z * 0.023) * 1.6;
  const e = Math.max(0, d - 4.6); const h = e * (0.12 + 0.05 * n) + e ** 1.25 * 0.02;
  pos.setY(i, Math.max(0, h));
  const c = cA.clone().lerp(cB, Math.min(1, h / 8)).lerp(cC, Math.max(0, 0.35 - h / 10) * (0.5 + 0.5 * Math.sin(x * 0.2 + z * 0.15)));
  cols.push(c.r, c.g, c.b);
}
ground.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); ground.computeVertexNormals();
const groundMesh = new THREE.Mesh(ground, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
groundMesh.receiveShadow = true; scene.add(groundMesh);

// Road ribbon
const rv = [], ri = [], rc = []; const N = 260, W2 = 1.35;
for (let k = 0; k <= N; k++) {
  const z = 10 - k * 1.2, x = roadX(z), dx = roadX(z - 0.5) - roadX(z + 0.5);
  const len = Math.hypot(dx, 1); const nx = 1 / len, nz = dx / len; // perpendicular
  rv.push(x - nx * W2, 0.06, z - nz * W2, x + nx * W2, 0.06, z + nz * W2);
  if (k < N) { const a = k * 2; ri.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
}
const rg2 = new THREE.BufferGeometry(); rg2.setAttribute('position', new THREE.Float32BufferAttribute(rv, 3)); rg2.setIndex(ri); rg2.computeVertexNormals();
const road = new THREE.Mesh(rg2, new THREE.MeshStandardMaterial({ color: 0xe9c48c, roughness: 0.85, side: THREE.DoubleSide }));
road.receiveShadow = true; scene.add(road);
// centre dashes
for (let k = 0; k < 90; k++) {
  const z = 8 - k * 3.2, x = roadX(z), dx = roadX(z - 0.5) - roadX(z + 0.5);
  const dash = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 1.3), new THREE.MeshStandardMaterial({ color: 0xfff6dc, roughness: 0.6 }));
  dash.position.set(x, 0.08, z); dash.rotation.y = Math.atan2(dx, 1); dash.receiveShadow = true; scene.add(dash);
}

// Distant mountains
const mtnMat = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 1 });
[[-120, -230, 70, 55, 0x6d4a63], [-30, -260, 60, 40, 0x7b5068], [70, -250, 80, 48, 0x6a4762], [170, -220, 70, 60, 0x5d4060], [-200, -200, 60, 50, 0x5d4060]]
  .forEach(([x, z, r, h, c]) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7, 1), mtnMat(c)); m.position.set(x, h / 2 - 4, z); m.rotation.y = x; scene.add(m); });
// Trees along the road
const treeMat = new THREE.MeshStandardMaterial({ color: 0x1f6b4a, flatShading: true, roughness: 0.9 });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3a26 });
for (let k = 0; k < 26; k++) {
  const z = -6 - k * 7 - (k % 3) * 2, side = k % 2 ? 1 : -1, x = roadX(z) + side * (4.2 + (k % 4) * 1.3);
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.9, 6), trunkMat); trunk.position.y = 0.45;
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.4, 7), treeMat); crown.position.y = 2;
  t.add(trunk, crown); t.position.set(x, 0, z); t.scale.setScalar(1 + (k % 3) * 0.25);
  t.traverse((o) => { o.castShadow = true; }); scene.add(t);
}

// Student (seen from behind, walking towards the sun)
const M = (c, r = 0.7) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const shirt = M(0x2a7fa8), pants = M(0x2b2f45), skin = M(0xc2875a, 0.6), hair = M(0x1a1412, 0.5), bag = M(0xe5762b, 0.55), capM = M(0x15151c, 0.4), shoe = M(0xf2f2f2, 0.5), gold = new THREE.MeshStandardMaterial({ color: 0xf5c04a, metalness: 0.6, roughness: 0.3 });
const kid = new THREE.Group(); scene.add(kid);
const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; };
function limb(len, r, mat, px, py, pz, rx, rz = 0, footMat) {
  const pivot = new THREE.Group(); pivot.position.set(px, py, pz);
  const l = part(new THREE.CapsuleGeometry(r, len, 6, 12), mat, 0, -len / 2 - r * 0.2, 0); pivot.add(l);
  if (footMat) { const f = part(new RoundedBoxGeometry(0.2, 0.12, 0.34, 3, 0.05), footMat, 0, -len - r - 0.02, -0.06); pivot.add(f); }
  pivot.rotation.set(rx, 0, rz); kid.add(pivot); return pivot;
}
limb(0.78, 0.12, pants, -0.15, 1.0, 0, 0.42, 0, shoe);   // left leg forward
limb(0.78, 0.12, pants, 0.15, 1.0, 0, -0.38, 0, shoe);   // right leg back
const torso = part(new THREE.CapsuleGeometry(0.29, 0.5, 6, 16), shirt, 0, 1.47, 0); torso.scale.set(1.12, 1, 0.78); kid.add(torso);
limb(0.56, 0.085, shirt, -0.4, 1.8, 0, -0.45, 0.12);    // left arm back
limb(0.56, 0.085, shirt, 0.4, 1.8, 0, 0.45, -0.12);     // right arm forward
kid.add(part(new THREE.CylinderGeometry(0.08, 0.09, 0.14, 12), skin, 0, 1.98, 0));
const head = part(new THREE.SphereGeometry(0.21, 32, 16), skin, 0, 2.17, 0); kid.add(head);
const hairM = part(new THREE.SphereGeometry(0.218, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.62), hair, 0, 2.18, 0.015); hairM.rotation.x = 0.35; kid.add(hairM);
kid.add(part(new THREE.SphereGeometry(0.05, 12, 8), skin, -0.21, 2.15, 0), part(new THREE.SphereGeometry(0.05, 12, 8), skin, 0.21, 2.15, 0));
// graduation cap
kid.add(part(new THREE.CylinderGeometry(0.2, 0.21, 0.1, 24), capM, 0, 2.34, 0));
const board = part(new THREE.BoxGeometry(0.62, 0.035, 0.62), capM, 0, 2.4, 0); board.rotation.y = Math.PI / 4; kid.add(board);
kid.add(part(new THREE.SphereGeometry(0.03, 12, 8), gold, 0, 2.425, 0));
const tassel = part(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 6), gold, 0.3, 2.27, 0.05); tassel.rotation.z = 0.08; kid.add(tassel);
kid.add(part(new THREE.SphereGeometry(0.035, 10, 8), gold, 0.31, 2.11, 0.05));
// backpack
kid.add(part(new RoundedBoxGeometry(0.52, 0.62, 0.26, 4, 0.08), bag, 0, 1.5, 0.3));
kid.add(part(new RoundedBoxGeometry(0.38, 0.22, 0.08, 3, 0.04), M(0xc85f1d, 0.6), 0, 1.36, 0.45));
[-0.17, 0.17].forEach((x) => { const s = part(new THREE.BoxGeometry(0.06, 0.55, 0.04), M(0x8a3a10, 0.7), x, 1.62, 0.17); s.rotation.x = -0.15; kid.add(s); });
kid.position.set(roadX(0) + 0.45, 0.06, 0); kid.rotation.y = Math.atan2(roadX(-1) - roadX(1), 2) * 0.6;

// Camera
const cam = new THREE.PerspectiveCamera(mode === 'banner' ? 40 : 46, W / H, 0.1, 1500);
if (mode === 'banner') { cam.position.set(roadX(0) + 3.2, 1.9, 6.5); cam.lookAt(roadX(-40) + 6, 4.6, -60); }
else { cam.position.set(roadX(0) + 0.55, 2.0, 6.0); cam.lookAt(roadX(-30) - 3.5, 5.4, -60); }
renderer.render(scene, cam);
window.done = true;
</script></body></html>

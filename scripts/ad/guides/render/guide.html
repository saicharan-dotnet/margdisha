<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'NTel';src:url('../fonts/NotoSansTelugu.ttf')}
@font-face{font-family:'NDev';src:url('../fonts/NotoSansDevanagari.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#061614;font-family:'Inter Display','Inter','NTel','NDev',sans-serif;color:#fff}
#bgbase{position:absolute;inset:0;background:radial-gradient(1300px 900px at 70% 35%,#16463f 0%,#0b2522 50%,#051311 100%)}
#bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9}
#cv{position:absolute;inset:0;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:16px;padding:0 64px;opacity:0}
#top img{width:52px;height:52px;border-radius:13px}
#top .b{font-weight:900;font-size:32px}
#top .g{margin-left:auto;font:700 26px 'Inter';color:#9fe0d3}
#prog{position:absolute;left:64px;right:64px;top:92px;height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd567,#f0a830)}
/* title */
.t-img{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:65% 50%}
.t-sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,19,17,.97) 0%,rgba(5,19,17,.9) 34%,rgba(5,19,17,.35) 56%,rgba(5,19,17,0) 72%)}
.t-box{position:absolute;left:110px;top:270px;width:900px}
.t-k{display:inline-block;font:800 30px 'Inter';color:#3a2300;background:linear-gradient(160deg,#fff1b8,#ffd567 40%,#f0a830);padding:8px 24px;border-radius:999px}
.t-h{margin-top:26px;font-weight:900;font-size:112px;line-height:1;letter-spacing:-4px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.t-s{margin-top:24px;font:700 40px 'Inter';color:#d6efe9}
/* points / steps */
.p-h{position:absolute;left:110px;top:160px;width:1100px;font-weight:900;font-size:78px;letter-spacing:-2.5px;line-height:1.02}
.p-bar{position:absolute;left:112px;top:262px;width:120px;height:8px;border-radius:9px;background:linear-gradient(90deg,#ffd567,#f0a830)}
.p-list{position:absolute;left:110px;top:310px;width:1060px;display:flex;flex-direction:column;gap:22px}
.card{display:flex;align-items:center;gap:26px;min-height:112px;padding:20px 30px;border-radius:26px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);
 box-shadow:0 14px 40px rgba(0,0,0,.25);font:700 40px/1.2 'Inter Display';opacity:0}
.card .ic{flex:none;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff1b8,#ffd567 40%,#f0a830);color:#3a2300;font:900 34px 'Inter'}
.card .ic svg{width:36px;height:36px;stroke:#3a2300;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.card.on{background:rgba(255,213,103,.13);border-color:rgba(255,213,103,.65)}
.p-img{position:absolute;left:1250px;top:170px;width:580px;height:740px;border-radius:34px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.2),0 40px 90px rgba(0,0,0,.5)}
.p-img div{position:absolute;inset:0;background-size:cover;background-position:62% 50%}
/* web */
.w-win{position:absolute;left:740px;top:150px;width:1080px;height:760px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 40px 90px rgba(0,0,0,.55)}
.w-bar{height:52px;background:#eef1f0;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #d9dfdd}
.w-bar i{width:14px;height:14px;border-radius:50%;display:block}
.w-url{margin-left:20px;flex:1;height:32px;border-radius:999px;background:#fff;border:1px solid #d5dbd9;display:flex;align-items:center;padding:0 16px;font:600 18px 'Inter';color:#3b4a47}
.w-url b{color:#0d6b5e}
.w-view{position:absolute;left:0;top:52px;right:0;bottom:0;overflow:hidden}
.w-view img{position:absolute;left:-150px;top:0;width:1420px}
.w-left{position:absolute;left:110px;top:250px;width:580px}
.w-left .p-h{position:static;width:auto;font-size:74px}
.chips{margin-top:34px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.chip{font:800 34px 'Inter Display','NTel','NDev';padding:12px 26px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);opacity:0}
.chip.g{color:#3a2300;background:linear-gradient(160deg,#fff1b8,#ffd567 40%,#f0a830);border-color:transparent}
/* end */
.e-row{position:absolute;left:0;right:0;top:230px;display:flex;align-items:center;justify-content:center;gap:34px}
.e-row img{width:150px;height:150px;border-radius:36px;box-shadow:0 0 60px rgba(255,200,90,.4)}
.e-row div{font-weight:900;font-size:140px;letter-spacing:-5px}
.e-c{position:absolute;left:0;right:0;text-align:center;opacity:0}
.e-url{display:inline-block;font-weight:900;font-size:62px;color:#3a2300;background:linear-gradient(160deg,#fff1b8,#ffd567 40%,#f0a830);padding:12px 54px;border-radius:999px;box-shadow:0 0 60px rgba(255,190,60,.7)}
.e-free{font:700 38px 'Inter','NTel','NDev';color:#e8f5f2}
.e-sub{display:inline-flex;align-items:center;gap:16px;font:800 40px 'Inter';background:#e62117;padding:14px 36px;border-radius:999px;box-shadow:0 10px 40px rgba(230,33,23,.45)}
.e-sub small{font:700 30px 'Inter';opacity:.9}
.subt{position:absolute;left:120px;right:120px;top:968px;text-align:center;font:700 40px/1.25 'Inter Display';text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 3px #000;opacity:0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,245,215,1),rgba(255,205,110,.5) 40%,transparent 75%);opacity:0;mix-blend-mode:screen}
#black{position:absolute;inset:0;background:#000;opacity:1}
</style></head><body>
<div id="bgbase"></div><div id="bgimg"></div>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="scenes"></div>
<div id="top"><img src="logo.png"><span class="b">MargDisha</span><span class="g" id="gt"></span></div>
<div id="prog"><i id="pi"></i></div>
<div id="subs"></div>
<div id="flash"></div>
<div id="black"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const out=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ramp=(t,a,b)=>cl((t-a)/(b-a));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=window.G, TL=window.TL; const END=TL.end; const SC=G.scenes;
const COVER=`url(${G.cover}.png)`;
$('bgimg').style.backgroundImage=`url(${G.cover}-blur.jpg)`; $('gt').textContent=G.title;
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
// scene windows: [from, to, voiceStart, voiceDur]
const W=SC.map((s,i)=>{const [vs,vd]=TL.v[i];const from=i==0?0:vs-.45;const to=i==SC.length-1?END:TL.v[i+1][0]-.45;return [from,to,vs,vd]});
$('scenes').innerHTML=SC.map((s,i)=>{
  if(s.type==='title')return `<div class="scene" id="sc${i}"><div class="t-img" id="ti${i}" style="background-image:${COVER}"></div><div class="t-sh"></div>
    <div class="t-box"><span class="t-k">Free guide</span><div class="t-h">${esc(G.title)}</div><div class="t-s">${esc(G.sub)}</div></div></div>`;
  if(s.type==='points'||s.type==='steps')return `<div class="scene" id="sc${i}"><div class="p-h">${esc(s.h)}</div><div class="p-bar"></div>
    <div class="p-list">${s.items.map((x,j)=>`<div class="card"><span class="ic">${s.type==='steps'?j+1:CHECK}</span><span>${esc(x)}</span></div>`).join('')}</div>
    <div class="p-img"><div style="background-image:${COVER};background-position:${G.pos||"62% 50%"}"></div></div></div>`;
  if(s.type==='web')return `<div class="scene" id="sc${i}"><div class="w-left"><div class="p-h">${esc(s.h)}</div><div class="chips">${s.items.map((x,j)=>`<span class="chip${j==0?' g':''}">${esc(x)}</span>`).join('')}</div></div>
    <div class="w-win"><div class="w-bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="w-url"><b>margdisha.com</b>${esc(G.web[1])}</div></div><div class="w-view"><img src="shots/${G.web[0]}"></div></div></div>`;
  return `<div class="scene" id="sc${i}"><div class="e-row"><img src="logo.png"><div>MargDisha</div></div>
    <div class="e-c" style="top:450px"><span class="e-url">margdisha.com</span></div>
    <div class="e-c e-free" style="top:600px">100% free · Official links · English · తెలుగు · हिन्दी</div>
    <div class="e-c" style="top:700px"><span class="e-sub">▶ Subscribe <small>@margdishaindia</small></span></div></div>`;
}).join('');
// subtitles: about 8 words per chunk, timed by word share
const SUBS=[];
SC.forEach((s,i)=>{const words=s.say.replace(/Marg Disha dot com/g,'MargDisha.com').replace(/\bA I S S E E\b/g,'AISSEE').replace(/\b([A-Z]) (?=[A-Z]\b)/g,'$1').replace(/\be PASS\b/g,'ePASS').replace(/\bE CET\b/g,'ECET').replace(/\bBi P C\b/g,'BiPC').replace(/\bB (Sc|Tech|Com|A)\b/g,'B.$1').replace(/\bM Tech\b/g,'M.Tech').split(/\s+/);
  const ch=[];for(let k=0;k<words.length;k+=8)ch.push(words.slice(k,k+8));if(ch.length>1&&ch[ch.length-1].length<3){const l=ch.pop();ch[ch.length-1].push(...l);}
  let st=TL.v[i][0];ch.forEach(c=>{const d=TL.v[i][1]*c.length/words.length;SUBS.push([st,st+d,c.join(' ')]);st+=d;});});
$('subs').innerHTML=SUBS.map((s,i)=>`<div class="subt" id="sb${i}">${esc(s[2])}</div>`).join('');
let seed=17;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const P=[...Array(90)].map(()=>({x:rnd()*1920,y:rnd()*1080,vx:(rnd()-.5)*12,vy:8+rnd()*22,r:.7+rnd()*2,ph:rnd()*6.28,sp:1+rnd()*2.5}));
const cx=$('cv').getContext('2d');
window.setT=function(t){
  $('black').style.opacity=Math.max(1-ramp(t,0,.5),ramp(t,END-.7,END));
  const firstBody=W[1][0], lastStart=W[SC.length-1][0];
  const bar=Math.min(ramp(t,firstBody,firstBody+.5),1-ramp(t,lastStart-.2,lastStart+.3));
  $('top').style.opacity=bar;$('prog').style.opacity=bar;$('pi').style.width=(100*ramp(t,firstBody,lastStart))+'%';
  SC.forEach((s,i)=>{const [a,b,vs,vd]=W[i];const el=$('sc'+i);
    const o=i==0?1-ramp(t,b-.1,b+.4):Math.min(ramp(t,a,a+.45),i==SC.length-1?1:1-ramp(t,b-.1,b+.35));
    el.style.opacity=o; if(o<=0)return;
    const k=out(ramp(t,a,a+.7));
    if(s.type==='title'){$('ti'+i).style.transform=`scale(${1.03+.08*ease(ramp(t,0,b))})`;
      el.querySelectorAll('.t-k,.t-h,.t-s').forEach((e,j)=>{const q=out(ramp(t,.4+j*.35,1.0+j*.35));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*30}px)`});}
    if(s.type==='points'||s.type==='steps'){
      el.querySelector('.p-h').style.transform=`translateX(${(1-k)*-40}px)`;el.querySelector('.p-bar').style.width=(120*k)+'px';
      const im=el.querySelector('.p-img');im.style.transform=`translateX(${(1-k)*80}px)`;im.style.opacity=k;
      im.firstChild.style.transform=`scale(${1.08+.06*ease(ramp(t,a,b))})`;
      const n=s.items.length;el.querySelectorAll('.card').forEach((c,j)=>{const at=vs+vd*(0.04+0.82*j/n);const q=back(ramp(t,at,at+.45));
        c.style.opacity=ramp(t,at,at+.2);c.style.transform=`translateX(${(1-q)*-60}px)`;
        const nx=j+1<n?vs+vd*(0.04+0.82*(j+1)/n):vs+vd+.4;c.classList.toggle('on',t>=at&&t<nx);});}
    if(s.type==='web'){const w=el.querySelector('.w-win');w.style.transform=`perspective(2200px) rotateY(${-7+3*k}deg) translateX(${(1-k)*200}px) translateY(${Math.sin(t*.8)*5}px)`;
      const wi=el.querySelector('.w-view img');const span=Math.max(0,Math.min(320,wi.naturalHeight*1420/Math.max(1,wi.naturalWidth)-708));wi.style.transform=`translateY(${-span*ease(ramp(t,vs,vs+vd))}px)`;
      el.querySelectorAll('.chip').forEach((c,j)=>{const at=vs+vd*(0.1+0.25*j);const q=back(ramp(t,at,at+.4));c.style.opacity=ramp(t,at,at+.15);c.style.transform=`scale(${.6+.4*q})`});}
    if(s.type==='end'){el.querySelectorAll('.e-c').forEach((e,j)=>{const at=a+.3+.45*j;const q=out(ramp(t,at,at+.5));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*30}px)`});
      el.querySelector('.e-row').style.transform=`scale(${.8+.2*back(ramp(t,a,a+.7))})`;}
  });
  const le=W[SC.length-1][0];$('flash').style.opacity=Math.exp(-Math.pow((t-(le+.3))/.22,2))*.5;
  SUBS.forEach((s,i)=>{$('sb'+i).style.opacity=Math.min(ramp(t,s[0],s[0]+.1),1-ramp(t,s[1]-.1,s[1]))});
  cx.clearRect(0,0,1920,1080);
  for(const p of P){const x=((p.x+p.vx*t)%1920+1920)%1920,y=((p.y-p.vy*t)%1080+1080)%1080;cx.globalAlpha=.4*(.35+.65*Math.abs(Math.sin(p.ph+t*p.sp)));cx.fillStyle='#ffe2a8';cx.shadowColor='#ffd27a';cx.shadowBlur=8;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill();}
};
setT(0);
</script></body></html>

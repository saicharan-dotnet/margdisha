<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'NTel';src:url('../fonts/NotoSansTelugu.ttf');font-weight:100 900}
@font-face{font-family:'NDev';src:url('../fonts/NotoSansDevanagari.ttf');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#061614;font-family:'Inter Display','Inter','NTel','NDev',sans-serif;color:#fff}
#bgbase{position:absolute;inset:0;background:radial-gradient(1300px 900px at 70% 35%,#16463f 0%,#0b2522 50%,#051311 100%)}
#bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9}

.scene{position:absolute;inset:0;opacity:0}

.t-img{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:65% 50%}

 box-shadow:0 14px 40px rgba(0,0,0,.25);font:700 40px/1.2 'Inter Display';opacity:0}
.card .ic{flex:none;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff1b8,#ffd567 40%,#f0a830);color:#3a2300;font:900 34px 'Inter'}

.card.on{background:rgba(255,213,103,.13);border-color:rgba(255,213,103,.65)}
.p-img{position:absolute;left:1250px;top:170px;width:580px;height:740px;border-radius:34px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.2),0 40px 90px rgba(0,0,0,.5)}
.p-img div{position:absolute;inset:0;background-size:cover;background-position:62% 50%}
/* web */

.L .t-h{font-size:92px;line-height:1.15;letter-spacing:-1px}.L .p-h{font-size:66px;line-height:1.2;letter-spacing:-1px;top:150px}.L .p-bar{top:262px}.L .card{font-size:34px;line-height:1.35;min-height:100px}.L .w-left .p-h{font-size:62px}.L .chip{font-size:30px}.L .subt{font-size:36px;line-height:1.4;top:960px}

.j-row{position:absolute;left:96px;right:96px;display:flex;align-items:center;gap:0}
.j-tag{flex:none;width:210px;font:900 30px 'Inter Display';color:#3a2300;background:linear-gradient(160deg,#fff1b8,#ffd567 40%,#f0a830);padding:14px 10px;border-radius:999px;text-align:center;opacity:0}

.j-alt b{font:800 24px 'Inter Display';display:inline}.j-alt span{display:inline;margin-left:8px;font:700 19px 'Inter';color:#bff5e8}
.j-alt:after{content:'';position:absolute;left:50%;top:100%;height:24px;border-left:3px dashed rgba(90,220,190,.75)}

</style></head><body>
<div id="bgbase"></div><div id="bgimg"></div>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="scenes"></div>
<div id="top"><img src="logo.png"><span class="b">MargDisha</span><span class="g" id="gt"></span></div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const out=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ramp=(t,a,b)=>cl((t-a)/(b-a));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=window.G, TL=window.TL; const END=TL.end; const SC=G.scenes;
const COVER=`url(${G.cover}.png)`;
if(G.theme==='light')document.body.classList.add('Tl');if(G.theme==='blue'||G.theme==='black')document.body.classList.add('Tb');if(G.theme==='black')document.body.classList.add('Tk');
if(G.lang&&G.lang!=='en')document.body.classList.add('L','L'+G.lang);
$('bgimg').style.backgroundImage=`url(${G.cover}-blur.jpg)`; $('gt').textContent=G.title;
const ICE='<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>';const ICJ='<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/></svg>';
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
// scene windows: [from, to, voiceStart, voiceDur]
const W=SC.map((s,i)=>{const [vs,vd]=TL.v[i];const from=i==0?0:vs-.45;const to=i==SC.length-1?END:TL.v[i+1][0]-.45;return [from,to,vs,vd]});
$('scenes').innerHTML=SC.map((s,i)=>{
  if(s.type==='title')return `<div class="scene" id="sc${i}"><div class="t-img" id="ti${i}" style="background-image:${COVER}"></div><div class="t-sh"></div>
    <div class="t-box"><span class="t-k">${G.lang==='te'?'ఉచిత గైడ్':G.lang==='hi'?'मुफ़्त गाइड':'Free guide'}</span><div class="t-h">${s.lines?s.lines.map((l,k)=>k?`<em>${esc(l)}</em>`:esc(l)).join('<br>'):esc(G.title)}</div><div class="t-s">${esc(G.sub)}</div></div></div>`;
  if(s.type==='points'||s.type==='steps')return `<div class="scene" id="sc${i}"><div class="p-h">${esc(s.h)}</div><div class="p-bar"></div>
    <div class="p-list">${s.items.map((x,j)=>`<div class="card"><span class="ic">${s.type==='steps'?j+1:CHECK}</span><span>${esc(x)}</span></div>`).join('')}</div>
    <div class="p-img"><div style="background-image:${COVER};background-position:${G.pos||"62% 50%"}"></div></div></div>`;
  if(s.type==='tree')return treeHTML(s,i);
  if(s.type==='map')return mapHTML(s,i);
  if(s.type==='journey')return journeyHTML(s,i);
  if(s.type==='web')return `<div class="scene" id="sc${i}"><div class="w-left"><div class="p-h">${esc(s.h)}</div><div class="chips">${s.items.map((x,j)=>`<span class="chip${j==0?' g':''}">${esc(x)}</span>`).join('')}</div></div>
    <div class="w-win"><div class="w-bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="w-url"><b>margdisha.com</b>${esc(G.web[1])}</div></div><div class="w-view"><img src="shots/${G.web[0]}"></div></div></div>`;
  return `<div class="scene" id="sc${i}"><div class="e-row"><img src="logo.png"><div>MargDisha</div></div>
    <div class="e-c" style="top:450px"><span class="e-url">margdisha.com</span></div>
    <div class="e-c e-free" style="top:600px">${G.lang==='te'?'100% ఉచితం · అధికారిక లింకులు · తెలుగు · English · हिन्दी':G.lang==='hi'?'100% मुफ़्त · आधिकारिक लिंक · हिन्दी · English · తెలుగు':'100% free · Official links · English · తెలుగు · हिन्दी'}</div>
    <div class="e-c" style="top:700px"><span class="e-sub">▶ ${G.lang==='te'?'సబ్‌స్క్రైబ్':G.lang==='hi'?'सब्सक्राइब':'Subscribe'} <small>@margdishaindia</small></span></div>
    <div class="e-c" style="top:830px"><span class="e-desc">⬇ ${G.lang==='te'?'అన్ని లింకులు కింద డిస్క్రిప్షన్‌లో':G.lang==='hi'?'सभी लिंक नीचे डिस्क्रिप्शन में':'All links in the description below'} ⬇</span></div></div>`;
}).join('');

// ---- tree: root -> rows of [course, exam, jobs] (or wide: [qualification, jobs]) ----
function ARW(x1,y1,x2,y2){return `M${x1} ${y1} C${(x1+x2)/2} ${y1},${(x1+x2)/2} ${y2},${x2} ${y2}`;}
function treeLayout(s){const n=s.rows.length,top=300,bot=935,h=(bot-top)/n,ch=Math.min(118,h-22);
  const X=s.wide?[[500,720],[780,1830]]:[[500,830],[885,1345],[1400,1830]];return {n,top,h,ch,X,ry:(top+bot)/2};}
function treeHTML(s,i){const L=treeLayout(s);const X=L.X;let paths='',rows='';
  s.rows.forEach((r,j)=>{const cy=L.top+L.h*(j+.5),y=cy-L.ch/2;
    paths+=`<path id="tp${i}_${j}" d="${ARW(400,L.ry,X[0][0],cy)}"/>`;
    for(let k=1;k<X.length;k++)paths+=`<path id="tq${i}_${j}_${k}" d="M${X[k-1][1]} ${cy} L${X[k][0]} ${cy}"/>`;
    rows+=`<div class="x-row" id="tr${i}_${j}">`+r.map((t,k)=>`<div class="x-node ${k==0?'x-c':k==X.length-1&&X.length==3?'x-j':s.wide?'x-j':'x-e'}" style="left:${X[k][0]}px;top:${y}px;width:${X[k][1]-X[k][0]}px;height:${L.ch}px">${k==0?'':(k==X.length-1?ICJ:ICE)}<span>${esc(t)}</span></div>`).join('')+`</div>`;});
  const cols=s.cols.map((c,k)=>c&&k<X.length?`<div class="x-col" style="left:${X[k][0]+4}px">${esc(c)}</div>`:'').join('');
  return `<div class="scene" id="sc${i}"><div class="x-h">${esc(s.h)}</div><div class="x-bar"></div>${cols}
   <svg class="x-svg">${paths}</svg><div class="x-node x-root" id="rt${i}" style="left:96px;top:${L.ry-90}px;width:304px;height:180px"><b>${esc(s.root[0])}</b><small>${esc(s.root[1])}</small></div>${rows}</div>`;}
// ---- map: root on top, children below ----
function mapLayout(s){const n=s.kids.length,gap=30,w=(1920-192-gap*(n-1))/n;return {n,w,xs:s.kids.map((_,j)=>96+j*(w+gap)),ky:520};}
function mapHTML(s,i){const L=mapLayout(s);let p=`<path id="mb${i}" d="M960 395 L960 450"/>`;
  L.xs.forEach((x,j)=>{const cx=x+L.w/2;p+=`<path id="mk${i}_${j}" d="M960 450 C960 480,${cx} 450,${cx} ${L.ky}"/>`;});
  const kids=s.kids.map((k,j)=>`<div class="x-node m-kid" id="mk${i}n${j}" style="left:${L.xs[j]}px;top:${L.ky}px;width:${L.w}px;min-height:${s.kids[0][1].includes('·')?250:150}px;padding:22px 12px"><b>${esc(k[0])}</b>${k[1].split(' · ').map(t=>`<span>${esc(t)}</span>`).join('')}</div>`).join('');
  return `<div class="scene" id="sc${i}"><div class="x-h">${esc(s.h)}</div><div class="x-bar"></div><svg class="x-svg">${p}</svg>
   <div class="x-node x-root" id="rt${i}" style="left:780px;top:265px;width:360px;height:130px"><b>${esc(s.root)}</b></div>${kids}</div>`;}
// ---- journey: example paths, step by step ----
function journeyHTML(s,i){const n=s.rows.length,top=n==3?300:360,h=n==3?215:270;
  return `<div class="scene" id="sc${i}"><div class="x-h">${esc(s.h)}</div><div class="x-bar"></div>`+s.rows.map((r,j)=>{
   const st=r.steps.map(x=>{if(x.fork)return `<div class="j-st j-s"><div class="j-alt"><b>or ${esc(x.fork[0][0])}</b><span>${esc(x.fork[0][1])}</span></div><b>${esc(x.fork[1][0])}</b><span>${esc(x.fork[1][1])}</span></div>`;
     return `<div class="j-st j-s"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`;}).join('<div class="j-ar j-s">→</div>');
   return `<div class="j-row" id="jr${i}_${j}" style="top:${top+h*j+(r.steps.some(x=>x.fork)?30:0)}px"><div class="j-tag">${esc(r.tag)}</div><div class="j-ar j-s">→</div>${st}<div class="j-ar j-s">→</div><div class="j-end j-s">${esc(r.end)}</div><div class="j-tot"><small>${G.lang==='te'?'మొత్తం':G.lang==='hi'?'कुल':'Total'}</small>${esc(r.total)}</div></div>`;}).join('')+`</div>`;}
function drawPath(el,q){if(!el)return;const L=el.getTotalLength();el.style.strokeDasharray=el.classList.contains('dim')?'':L;el.style.strokeDashoffset=L*(1-q);el.style.opacity=q>0?1:0;}
function pop(el,q){el.style.opacity=cl(q*3);el.style.transform=`scale(${.85+.15*back(q)})`;}
// subtitles: about 8 words per chunk, timed by word share
const SUBS=[];
SC.forEach((s,i)=>{const words=(s.sub||s.say).replace(/Marg Disha dot com/g,'MargDisha.com').replace(/\bA I S S E E\b/g,'AISSEE').replace(/\b([A-Z]) (?=[A-Z]\b)/g,'$1').replace(/\be PASS\b/g,'ePASS').replace(/\bE CET\b/g,'ECET').replace(/\bBi P C\b/g,'BiPC').replace(/\bB (Sc|Tech|Com|A)\b/g,'B.$1').replace(/\bM Tech\b/g,'M.Tech').split(/\s+/);
  const ch=[];for(let k=0;k<words.length;k+=8)ch.push(words.slice(k,k+8));if(ch.length>1&&ch[ch.length-1].length<3){const l=ch.pop();ch[ch.length-1].push(...l);}
  let st=TL.v[i][0];ch.forEach(c=>{const d=TL.v[i][1]*c.length/words.length;SUBS.push([st,st+d,c.join(' ')]);st+=d;});});
$('subs').innerHTML=SUBS.map((s,i)=>`<div class="subt" id="sb${i}">${esc(s[2])}</div>`).join('');
let seed=17;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const P=[...Array(90)].map(()=>({x:rnd()*1920,y:rnd()*1080,vx:(rnd()-.5)*12,vy:8+rnd()*22,r:.7+rnd()*2,ph:rnd()*6.28,sp:1+rnd()*2.5}));
const cx=$('cv').getContext('2d');
window.setT=function(t){
  $('black').style.opacity=Math.max(1-ramp(t,0,.5),ramp(t,END-.7,END));
  const firstBody=W[1][0], lastStart=W[SC.length-1][0];
  const bar=Math.min(ramp(t,firstBody,firstBody+.5),1-ramp(t,lastStart-.2,lastStart+.3));
  $('top').style.opacity=bar;$('prog').style.opacity=bar;$('pi').style.width=(100*ramp(t,firstBody,lastStart))+'%';
  SC.forEach((s,i)=>{const [a,b,vs,vd]=W[i];const el=$('sc'+i);
    const o=i==0?1-ramp(t,b-.1,b+.4):Math.min(ramp(t,a,a+.45),i==SC.length-1?1:1-ramp(t,b-.1,b+.35));
    el.style.opacity=o; if(o<=0)return;
    const k=out(ramp(t,a,a+.7));
    if(s.type==='title'){$('ti'+i).style.transform=`scale(${1.03+.08*ease(ramp(t,0,b))})`;
      el.querySelectorAll('.t-k,.t-h,.t-s').forEach((e,j)=>{const q=out(ramp(t,.4+j*.35,1.0+j*.35));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*30}px)`});}
    if(s.type==='points'||s.type==='steps'){
      el.querySelector('.p-h').style.transform=`translateX(${(1-k)*-40}px)`;el.querySelector('.p-bar').style.width=(120*k)+'px';
      const im=el.querySelector('.p-img');im.style.transform=`translateX(${(1-k)*80}px)`;im.style.opacity=k;
      im.firstChild.style.transform=`scale(${1.08+.06*ease(ramp(t,a,b))})`;
      const n=s.items.length;el.querySelectorAll('.card').forEach((c,j)=>{const at=vs+vd*(0.04+0.82*j/n);const q=back(ramp(t,at,at+.45));
        c.style.opacity=ramp(t,at,at+.2);c.style.transform=`translateX(${(1-q)*-60}px)`;
        const nx=j+1<n?vs+vd*(0.04+0.82*(j+1)/n):vs+vd+.4;c.classList.toggle('on',t>=at&&t<nx);});}
    if(s.type==='tree'){el.querySelector('.x-h').style.transform=`translateX(${(1-k)*-40}px)`;el.querySelector('.x-bar').style.width=(120*k)+'px';
      pop($('rt'+i),ramp(t,a+.2,a+.7));el.querySelectorAll('.x-col').forEach((c,j)=>c.style.opacity=ramp(t,a+.5+.15*j,a+.9+.15*j));
      const n=s.rows.length,nc=s.wide?2:3;s.rows.forEach((r,j)=>{const at=vs+vd*(0.08+0.84*j/n),nx=j+1<n?vs+vd*(0.08+0.84*(j+1)/n):vs+vd+.6;
        drawPath($(`tp${i}_${j}`),out(ramp(t,at,at+.45)));const row=$(`tr${i}_${j}`);row.classList.toggle('on',t>=at&&t<nx);
        row.querySelectorAll('.x-node').forEach((c,m)=>{const b0=at+.3+m*.35;if(m>0)drawPath($(`tq${i}_${j}_${m}`),out(ramp(t,b0-.2,b0+.05)));pop(c,ramp(t,b0,b0+.4));});});}
    if(s.type==='map'){el.querySelector('.x-h').style.transform=`translateX(${(1-k)*-40}px)`;el.querySelector('.x-bar').style.width=(120*k)+'px';
      pop($('rt'+i),ramp(t,a+.2,a+.7));drawPath($('mb'+i),out(ramp(t,a+.6,a+.9)));const n=s.kids.length;
      s.kids.forEach((kd,j)=>{const at=s.kids[0][1].includes('·')?vs+.3+j*.35:vs+vd*(0.12+0.6*j/n),nx=j+1<n?vs+vd*(0.12+0.6*(j+1)/n):vs+vd*.85;
        drawPath($(`mk${i}_${j}`),out(ramp(t,at-.1,at+.35)));const nd=$(`mk${i}n${j}`);pop(nd,ramp(t,at+.15,at+.55));nd.classList.toggle('on',!s.kids[0][1].includes('·')&&t>=at&&t<nx);});}
    if(s.type==='journey'){el.querySelector('.x-h').style.transform=`translateX(${(1-k)*-40}px)`;el.querySelector('.x-bar').style.width=(120*k)+'px';
      const n=s.rows.length;s.rows.forEach((r,j)=>{const at=vs+vd*(0.08+0.8*j/n),span=vd*0.8/n*0.75,nx=j+1<n?vs+vd*(0.08+0.8*(j+1)/n):vs+vd*.88;const row=$(`jr${i}_${j}`);
        row.classList.toggle('on',t>=at&&t<nx);pop(row.querySelector('.j-tag'),ramp(t,at,at+.4));const ss=row.querySelectorAll('.j-s');
        ss.forEach((e,m)=>{const b0=at+.25+span*m/ss.length;const q=ramp(t,b0,b0+.35);if(e.classList.contains('j-ar')){e.style.opacity=q;e.style.transform=`translateX(${(1-out(q))*-14}px)`;}else pop(e,q);
          const al=e.querySelector('.j-alt');if(al){const qa=ramp(t,b0+span*.25,b0+span*.25+.4);al.style.opacity=qa;}});
        const tot=row.querySelector('.j-tot');const tq=ramp(t,vs+vd*.88,vs+vd*.88+.4);pop(tot,tq);tot.style.boxShadow=`0 0 ${40*Math.exp(-Math.pow((t-(vs+vd*.9))/.5,2))}px rgba(160,255,230,.9)`;});}
    if(s.type==='web'){const w=el.querySelector('.w-win');w.style.transform=`perspective(2200px) rotateY(${-7+3*k}deg) translateX(${(1-k)*200}px) translateY(${Math.sin(t*.8)*5}px)`;
      const wi=el.querySelector('.w-view img');const span=Math.max(0,Math.min(320,wi.naturalHeight*1420/Math.max(1,wi.naturalWidth)-708));wi.style.transform=`translateY(${-span*ease(ramp(t,vs,vs+vd))}px)`;
      el.querySelectorAll('.chip').forEach((c,j)=>{const at=vs+vd*(0.1+0.25*j);const q=back(ramp(t,at,at+.4));c.style.opacity=ramp(t,at,at+.15);c.style.transform=`scale(${.6+.4*q})`});}
    if(s.type==='end'){el.querySelectorAll('.e-c').forEach((e,j)=>{const at=a+.3+.45*j;const q=out(ramp(t,at,at+.5));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*30}px)`});
      el.querySelector('.e-row').style.transform=`scale(${.8+.2*back(ramp(t,a,a+.7))})`;}
  });
  const le=W[SC.length-1][0];$('flash').style.opacity=Math.exp(-Math.pow((t-(le+.3))/.22,2))*.5;
  SUBS.forEach((s,i)=>{$('sb'+i).style.opacity=Math.min(ramp(t,s[0],s[0]+.1),1-ramp(t,s[1]-.1,s[1]))});
  cx.clearRect(0,0,1920,1080);
  for(const p of P){const x=((p.x+p.vx*t)%1920+1920)%1920,y=((p.y-p.vy*t)%1080+1080)%1080;cx.globalAlpha=.4*(.35+.65*Math.abs(Math.sin(p.ph+t*p.sp)));if(G.theme==='light'){const o=P.indexOf(p)%2;cx.fillStyle=o?'#ff9f43':'#4f8ef7';cx.shadowColor=cx.fillStyle;}else if(G.theme==='blue'||G.theme==='black'){cx.fillStyle='#bcd9ff';cx.shadowColor='#6fb1ff';}else{cx.fillStyle='#ffe2a8';cx.shadowColor='#ffd27a';}cx.shadowBlur=8;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill();}
};
setT(0);
</script></body></html>
